[package]
name = "taurissh"
version = "0.1.0"
description = "TauriSSH - cross-platform SSH workspace"
authors = ["szzz666"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "taurissh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "net"] }
russh = "0.65"
russh-sftp = "3"
base64 = "0.23"
sha2 = "0.11"
rand = "0.10"
thiserror = "2"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
futures-util = "0.3"
bytes = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
