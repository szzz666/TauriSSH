name: Release

# 每次提交自动发布：
#   - push 到 main：自动递增补丁号并发布 prerelease（v0.1.1-dev.<run>）
#   - push vX.Y.Z 标签 / 手动指定版本：发布正式版
# 三条路径都会构建 macOS(Apple Silicon / Intel)、Windows x64、Linux x64、Android、iOS 并上传到同一个 Release。
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      version:
        description: "指定版本号（例如 0.1.0）；留空则按最近标签自动递增"
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "22"
  RUST_VERSION: "stable"
  # 与 src-tauri/gen/android/app/build.gradle.kts 中的 compileSdk / ndkVersion 保持一致
  ANDROID_SDK_ROOT: "/usr/local/lib/android/sdk"
  ANDROID_COMPILE_SDK: "36"
  ANDROID_BUILD_TOOLS: "36.0.0"
  ANDROID_NDK_VERSION: "27.2.12479018"

permissions:
  contents: write

jobs:
  prepare:
    name: 计算版本并创建 Release
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      version_code: ${{ steps.version.outputs.version_code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          set -euo pipefail
          input="${{ inputs.version }}"

          if [ -n "${input:-}" ]; then
            version="${input#v}"
            prerelease=false
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
            prerelease=false
          else
            # 常规提交：在最近标签基础上递增补丁号，并附加 run number 保证唯一且递增
            base="$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)"
            base="${base#v}"
            if [ -z "$base" ]; then
              base="$(node -p "require('./src-tauri/tauri.conf.json').version")"
            fi
            major="$(echo "$base" | cut -d. -f1)"
            minor="$(echo "$base" | cut -d. -f2)"
            patch="$(echo "$base" | cut -d. -f3 | cut -d- -f1)"
            # 预发布标识必须纯数字：WiX(MSI) 只接受数字且 <= 65535，写 dev.1 会直接失败
            version="${major:-0}.${minor:-0}.$(( ${patch:-0} + 1 ))-${GITHUB_RUN_NUMBER}"
            prerelease=true
          fi

          # Android versionCode 必须是递增整数，且 <= 2100000000
          version_code="$(( GITHUB_RUN_NUMBER + 1000 ))"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "版本：$version ｜ versionCode：$version_code ｜ prerelease：$prerelease"

      - name: 创建或复用 Release
        id: create
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          existing="$(gh api "repos/${{ github.repository }}/releases/tags/$tag" --jq '.id' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            echo "release_id=$existing" >> "$GITHUB_OUTPUT"
            echo "复用已有 Release $tag（ID $existing）"
          else
            # -F 会按类型发送布尔值；--field 会把 true 当字符串，导致 422
            release_id="$(gh api "repos/${{ github.repository }}/releases" \
              --method POST \
              -f tag_name="$tag" \
              -f name="TauriSSH $tag" \
              -F draft=true \
              -F prerelease="${{ steps.version.outputs.prerelease }}" \
              -F generate_release_notes=true \
              --jq '.id')"
            echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
            echo "已创建 Release $tag（ID $release_id）"
          fi

  build-desktop:
    name: 桌面端 ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
            # 同一个 macOS runner 顺带产出 iOS 包，避免额外排队等待 macos-latest
            ios: true
          - name: macOS Intel
            platform: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: Linux x64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libfuse2 file

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: 安装前端依赖
        run: npm ci

      - name: 写入版本号
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          node -e "
            const fs = require('fs');
            for (const file of ['package.json', 'src-tauri/tauri.conf.json']) {
              const data = JSON.parse(fs.readFileSync(file, 'utf8'));
              data.version = process.env.VERSION;
              fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
            }
          "

      # 未配置签名凭据时必须完全不导出这些变量：
      # 空字符串会让 Tauri 判定为“要签名”，进而尝试导入不存在的 .p12 而报错
      - name: 注入可选签名凭据
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          injected=0
          while IFS='=' read -r key value; do
            if [ -n "${value:-}" ]; then
              # 多行值（.p12 的 base64 可能换行）用分隔符写入 GITHUB_ENV
              {
                echo "${key}<<__SIGN_EOF__"
                printf '%s\n' "$value"
                echo "__SIGN_EOF__"
              } >> "$GITHUB_ENV"
              injected=$((injected + 1))
            fi
          done <<< "$(env | grep -E '^(APPLE_|TAURI_SIGNING_)' || true)"
          echo "已注入 $injected 个签名变量（0 表示走未签名构建）"

      - name: 构建并上传
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: 安装 iOS Rust 目标
        if: matrix.ios
        run: rustup target add aarch64-apple-ios

      - name: 初始化 iOS 工程
        if: matrix.ios
        env:
          CI: "true"
        run: |
          if [ ! -d src-tauri/gen/apple ]; then
            npx tauri ios init --ci
          else
            echo "已存在 iOS 工程，跳过初始化"
          fi

      - name: 构建未签名 .ipa
        if: matrix.ios
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION%%-*}"
          npx tauri ios build --target aarch64 --ci --no-sign \
            --config "{\"version\":\"$version\"}"

      - name: 打包并上传 IPA
        if: matrix.ios
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ios-artifacts
          ipa="$(find src-tauri/gen/apple/build -name '*.ipa' | head -n 1 || true)"
          if [ -n "$ipa" ]; then
            cp "$ipa" "ios-artifacts/TauriSSH-${VERSION}-ios.ipa"
          else
            app="$(find src-tauri/gen/apple/build -name '*.app' | head -n 1 || true)"
            if [ -z "$app" ]; then
              echo "::error::未找到 iOS 构建产物"
              find src-tauri/gen/apple/build -maxdepth 4 || true
              exit 1
            fi
            mkdir -p ios-artifacts/Payload
            cp -R "$app" ios-artifacts/Payload/
            (cd ios-artifacts && zip -qry "TauriSSH-${VERSION}-ios.ipa" Payload)
            rm -rf ios-artifacts/Payload
          fi
          ls -la ios-artifacts
          tag="${{ needs.prepare.outputs.tag }}"
          for file in ios-artifacts/*; do
            gh release upload "$tag" "$file" --repo "${{ github.repository }}" --clobber
          done

  build-android:
    name: Android
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装 Android SDK 与 NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_COMPILE_SDK }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: 安装前端依赖
        run: npm ci

      - name: 初始化 Android 工程
        env:
          CI: "true"
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            npx tauri android init --ci
          else
            echo "已存在 Android 工程，跳过初始化"
          fi

      - name: 准备签名密钥库
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.keystore"
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
            pass="$ANDROID_KEYSTORE_PASSWORD"
            alias="${ANDROID_KEY_ALIAS:-taurissh}"
            key_pass="${ANDROID_KEY_PASSWORD:-$pass}"
            echo "使用仓库配置的发布密钥库"
          else
            # 未配置密钥时生成一次性密钥库，保证 APK 已签名、可直接安装
            pass="taurissh-ci"
            alias="taurissh"
            key_pass="$pass"
            keytool -genkeypair -v -keystore "$keystore" \
              -alias "$alias" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$pass" -keypass "$key_pass" \
              -dname "CN=TauriSSH CI, OU=CI, O=TauriSSH, L=CI, S=CI, C=CN" > /dev/null
            echo "::warning::未配置 ANDROID_KEYSTORE_BASE64，已生成临时签名密钥（不同构建之间签名不一致，无法覆盖安装）"
          fi
          {
            echo "ANDROID_KEYSTORE_PATH=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$pass"
            echo "ANDROID_KEY_ALIAS=$alias"
            echo "ANDROID_KEY_PASSWORD=$key_pass"
          } >> "$GITHUB_ENV"

      - name: 构建 APK（按 ABI 拆分）
        env:
          # 不要导出空的 NDK_HOME：tauri 见到该变量为空会直接报 "Android NDK invalid"，
          # 未设置时它会自己从 $ANDROID_HOME/ndk 里挑版本
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          # versionName 必须是纯语义化版本，dev 后缀会破坏 Android 版本解析
          version="${VERSION%%-*}"
          npx tauri android build --apk --split-per-abi --target aarch64 armv7 \
            --config "{\"version\":\"$version\",\"bundle\":{\"android\":{\"versionCode\":$VERSION_CODE}}}"

      - name: 构建 AAB（Google Play）
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          VERSION: ${{ needs.prepare.outputs.version }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          version="${VERSION%%-*}"
          npx tauri android build --aab --target aarch64 armv7 \
            --config "{\"version\":\"$version\",\"bundle\":{\"android\":{\"versionCode\":$VERSION_CODE}}}"

      - name: 收集 Android 产物
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # 产物路径形如 apk/<abi>/release/app-<abi>-release.apk，取 apk 之后的第一段作为 ABI
          find src-tauri/gen/android/app/build/outputs/apk -name "*-release.apk" | while read -r file; do
            abi="$(echo "$file" | sed -E 's#.*/outputs/apk/([^/]+)/.*#\1#')"
            cp "$file" "artifacts/TauriSSH-${VERSION}-android-${abi}.apk"
          done
          find src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" | while read -r file; do
            cp "$file" "artifacts/TauriSSH-${VERSION}-android.aab"
          done
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::未找到 Android 构建产物"
            find src-tauri/gen/android/app/build/outputs -type f || true
            exit 1
          fi
          ls -la artifacts

      - name: 上传 Android 产物
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          for file in artifacts/*; do
            gh release upload "$tag" "$file" --repo "${{ github.repository }}" --clobber
          done

  publish:
    name: 结束草稿并发布
    needs: [prepare, build-desktop, build-android]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-22.04
    steps:
      - name: 检查各平台结果
        shell: bash
        run: |
          echo "桌面端（含 iOS）：${{ needs.build-desktop.result }}"
          echo "Android：${{ needs.build-android.result }}"
          if [ "${{ needs.build-desktop.result }}" != "success" ] && \
             [ "${{ needs.build-android.result }}" != "success" ]; then
            echo "::error::所有平台均构建失败，保留草稿以便排查"
            exit 1
          fi

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          gh api "repos/${{ github.repository }}/releases/${{ needs.prepare.outputs.release_id }}" \
            --method PATCH -F draft=false -f tag_name="$tag"
          echo "已发布：${{ github.server_url }}/${{ github.repository }}/releases/tag/$tag"
